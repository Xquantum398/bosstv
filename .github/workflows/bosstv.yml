
name: Boss TV playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      # 1. Depoyu indir
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Python kur
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 3. Bağımlılıkları yükle
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright

      # 4. Chromium kur
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # 5. Dosyaları kontrol et
      - name: Check Repository Files
        run: |
          echo "Repository files:"
          ls -lah

          if [ ! -f bosstv.py ]; then
            echo "ERROR: bosstv.py bulunamadı!"
            exit 1
          fi

          echo "bosstv.py bulundu."

      # 6. Python sözdizimini kontrol et
      - name: Check Python Syntax
        run: |
          python -m py_compile bosstv.py
          echo "Python syntax OK."

      # 7. Script çalıştır
      - name: Run Scraper Script
        run: |
          python -u bosstv.py

      # 8. Değişiklikleri GitHub'a gönder
      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Boss TV playlist [skip ci]"
            git push
          else
            echo "Değişiklik bulunamadı."
          fi
